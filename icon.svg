<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0055" />
      <stop offset="50%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#00DFD8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="#05050a" />
  <rect x="40" y="40" width="432" height="432" rx="90" fill="url(#bgGrad)" opacity="0.15" />
  <rect x="40" y="40" width="432" height="432" rx="90" stroke="url(#bgGrad)" stroke-width="8" fill="none" />
  <text x="256" y="330" font-size="260" text-anchor="middle" filter="url(#glow)">🧊</text>
</svg>
